# Reusable: build, test and weigh one Android host app.
#
# Counterpart to _ios-app.yml. See the note there about why the logic lives in one file
# and the five approaches get thin wrappers.

name: _android-app

on:
  workflow_call:
    inputs:
      approach:
        description: Approach folder, e.g. 00-native
        required: true
        type: string
      project-dir:
        description: Directory holding settings.gradle.kts
        required: true
        type: string
      module:
        description: Gradle module to assemble
        required: false
        default: app
        type: string
      variant:
        description: Variant to weigh, e.g. release or bothRelease for a flavoured host
        required: false
        default: release
        type: string
      runner:
        description: Runner label — the Skip host needs a Mac to produce its AARs
        required: false
        default: ubuntu-24.04
        type: string
      run-tests:
        description: Run unit tests before assembling
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: ${{ inputs.approach }} (Android)
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v7

      - name: Read pinned versions
        run: |
          ./tools/versions.py android.jdk --github-env PINNED_JDK
          ./tools/versions.py android.compile_sdk --github-env PINNED_COMPILE_SDK
          ./tools/versions.py android.ndk --github-env PINNED_NDK
          ./tools/versions.py react_native.node --github-env PINNED_NODE
          ./tools/versions.py android.bundletool --github-env PINNED_BUNDLETOOL

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.PINNED_JDK }}

      - name: Guard — does this app exist yet?
        id: guard
        run: |
          if [[ -f "${{ inputs.project-dir }}/gradlew" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ inputs.project-dir }} has no gradlew yet — nothing to do"
          fi

      # Keeps both the wrapper distribution and the module cache, which between them are
      # most of a cold Gradle run. The NDK below is deliberately left uncached: it is around
      # three gigabytes and the repository only gets ten, so caching it once would evict
      # every entry that actually pays for itself.
      - uses: gradle/actions/setup-gradle@v6
        if: steps.guard.outputs.exists == 'true'

      # bundletool is a fixed, version-stamped 32 MB jar that measure-android.sh fetches
      # into tools/out, and every one of the five approaches fetches the same one.
      - uses: actions/cache@v6
        if: steps.guard.outputs.exists == 'true'
        with:
          path: tools/out/bundletool-*.jar
          key: bundletool-${{ env.PINNED_BUNDLETOOL }}

      - name: Install pinned NDK
        if: steps.guard.outputs.exists == 'true'
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$PINNED_NDK" \
            || echo "::warning::NDK $PINNED_NDK unavailable on this runner; falling back to preinstalled"

      # The 01 host links fightdeck.aar, which only a cross-compile produces; Gradle refuses
      # to configure without it.
      - uses: ./.github/actions/install-swift-android
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '01-core-swift'

      - uses: ./.github/actions/swiftpm-cache
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '01-core-swift'
        with:
          key: core-swift-android
          build-path: 01-core-swift/sdks/android/.build

      - name: Package the Swift SDKs
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '01-core-swift'
        working-directory: 01-core-swift/sdks
        run: ./build-aars.sh

      # The React Native host reads its Gradle plugin and its autolinked modules out of
      # node_modules, so Gradle cannot even configure the build without an install.
      - uses: actions/setup-node@v7
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '03-sdk-rn'
        with:
          node-version: ${{ env.PINNED_NODE }}
          cache: npm
          cache-dependency-path: 03-sdk-rn/sdks/core/package-lock.json

      - name: Install JS dependencies
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '03-sdk-rn'
        working-directory: 03-sdk-rn/sdks/core
        run: npm ci

      - name: Build the RN binary SDKs
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '03-sdk-rn'
        run: ./03-sdk-rn/sdks/build-android.sh

      # Skip's AARs are transpiler output rather than a checked-in dependency, so the host
      # has nothing to link until skipstone has run over the SDK modules. Pinned to the
      # lock file: a CLI newer than the packages' skipstone emits Gradle projects the AAR
      # scripts no longer recognise, and the failure surfaces as unresolved Kotlin symbols.
      - uses: ./.github/actions/install-skip
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '04-sdk-skip'

      - uses: ./.github/actions/swiftpm-cache
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '04-sdk-skip'
        with:
          key: sdk-skip-android
          build-path: |
            04-sdk-skip/sdks/core/.build
            04-sdk-skip/sdks/events/.build
            04-sdk-skip/sdks/deposit/.build
            04-sdk-skip/sdks/betslip/.build
            04-sdk-skip/sdks/fighter/.build

      - name: Export the Skip AARs
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '04-sdk-skip'
        run: ./04-sdk-skip/sdks/build-aars.sh

      # UniFFI bindings and jniLibs are build output, so package them before the host.
      - name: Read pinned Rust toolchain
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '02-core-rust'
        run: |
          ./tools/versions.py rust.toolchain --github-env PINNED_RUST
          ./tools/versions.py rust.cargo_ndk --github-env PINNED_CARGO_NDK

      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '02-core-rust'
        with:
          toolchain: ${{ env.PINNED_RUST }}
          targets: aarch64-linux-android

      # Same "android" entry as sdk-core-rust.yml: identical workspace, identical triples,
      # so whichever workflow runs first warms the other.
      - uses: ./.github/actions/cargo-cache
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '02-core-rust'
        with:
          key: android

      - uses: actions/cache@v6
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '02-core-rust'
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-${{ env.PINNED_CARGO_NDK }}

      # See sdk-core-rust.yml: .crates.toml is not cached, so cargo cannot tell that a
      # restored cargo-ndk is already installed and would rebuild it.
      - name: Install cargo-ndk
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '02-core-rust'
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --version "$PINNED_CARGO_NDK" --locked

      - name: Package the Rust SDKs
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '02-core-rust'
        working-directory: 02-core-rust/sdks
        run: ./build-android.sh

      # `test` rather than a named variant: AGP only wires unit tests to the test build
      # type, and the flavoured hosts would need a different task name than the rest.
      - name: Test
        if: steps.guard.outputs.exists == 'true' && inputs.run-tests
        working-directory: ${{ inputs.project-dir }}
        run: ./gradlew --no-daemon ":${{ inputs.module }}:test"

      - name: Assemble and measure
        if: steps.guard.outputs.exists == 'true'
        run: |
          ./tools/measure-android.sh \
            "${{ inputs.approach }}" \
            "${{ inputs.project-dir }}" \
            "${{ inputs.module }}" \
            "${{ inputs.variant }}"

      - name: Upload size report
        if: steps.guard.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android-size-${{ inputs.approach }}
          path: tools/out/android-${{ inputs.approach }}.json
          if-no-files-found: warn
