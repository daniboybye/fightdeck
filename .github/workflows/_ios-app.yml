# Reusable: build, test and weigh one iOS host app.
#
# Not dispatchable on its own. ios-app.yml offers the five approaches as a dropdown and
# measure.yml runs all of them, so the logic that must stay identical across the five
# lives here exactly once. If the five approaches were measured by five copies of this
# file they would drift, and a drifting measurement is worse than no measurement.

name: _ios-app

on:
  workflow_call:
    inputs:
      approach:
        description: Approach folder, e.g. 00-native
        required: true
        type: string
      scheme:
        description: Xcode scheme to archive
        required: true
        type: string
      project-dir:
        description: Directory holding the Xcode project or SwiftPM package
        required: true
        type: string
      run-tests:
        description: Run the unit test suite before archiving
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: ${{ inputs.approach }} (iOS)
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Pin Xcode from versions.lock.toml
        run: |
          XCODE_VERSION="$(./tools/versions.py apple.xcode)"
          echo "Pinned Xcode: $XCODE_VERSION"
          sudo xcode-select -switch "/Applications/Xcode_${XCODE_VERSION}.app" 2>/dev/null \
            || echo "::warning::Xcode ${XCODE_VERSION} not found at the expected path; using runner default"
          xcodebuild -version

      - name: Guard — does this app exist yet?
        id: guard
        run: |
          if [[ -d "${{ inputs.project-dir }}" ]] && \
             [[ -n "$(find '${{ inputs.project-dir }}' -maxdepth 2 \( -name '*.xcodeproj' -o -name 'Package.swift' \) 2>/dev/null)" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ inputs.project-dir }} is not built yet — nothing to do"
          fi

      - name: Install xcbeautify
        if: steps.guard.outputs.exists == 'true'
        run: command -v xcbeautify >/dev/null || brew install xcbeautify

      # Package clones only. Xcode builds into DerivedData, whose absolute paths and module
      # caches do not survive a move between runners, so carrying it over is a good way to
      # trade a slow clean build for a fast confusing one.
      - uses: ./.github/actions/swiftpm-cache
        if: steps.guard.outputs.exists == 'true'
        with:
          key: host-${{ inputs.approach }}

      # The React Native host links its SDKs through CocoaPods, and the Podfile resolves
      # react-native out of node_modules before it can generate anything.
      - name: Read pinned Node
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '03-sdk-rn'
        run: ./tools/versions.py react_native.node --github-env PINNED_NODE

      - uses: actions/setup-node@v7
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '03-sdk-rn'
        with:
          node-version: ${{ env.PINNED_NODE }}
          cache: npm
          cache-dependency-path: 03-sdk-rn/sdks/core/package-lock.json

      - name: Install JS dependencies
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '03-sdk-rn'
        working-directory: 03-sdk-rn/sdks/core
        run: npm ci

      - uses: actions/cache@v6
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '03-sdk-rn'
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('03-sdk-rn/ios/Podfile.lock') }}
          restore-keys: |
            cocoapods-${{ runner.os }}-

      - name: Build the RN binary SDKs
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '03-sdk-rn'
        run: |
          pod --version || sudo gem install cocoapods --no-document
          ./03-sdk-rn/sdks/build-apple.sh

      - name: Build the Skip binary SDKs
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '04-sdk-skip'
        run: ./04-sdk-skip/sdks/build-apple.sh

      # UniFFI bindings and xcframeworks are build output, so package them before the host.
      - name: Read pinned Rust toolchain
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '02-core-rust'
        run: ./tools/versions.py rust.toolchain --github-env PINNED_RUST

      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '02-core-rust'
        with:
          toolchain: ${{ env.PINNED_RUST }}
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      # Shares the "apple" entry with sdk-core-rust.yml on purpose: it is the same
      # workspace built for the same three triples, so the two workflows warm each other.
      - uses: ./.github/actions/cargo-cache
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '02-core-rust'
        with:
          key: apple

      - name: Package the Rust SDKs
        if: steps.guard.outputs.exists == 'true' && inputs.approach == '02-core-rust'
        working-directory: 02-core-rust/sdks
        run: ./build-apple.sh

      - name: Test
        if: steps.guard.outputs.exists == 'true' && inputs.run-tests
        working-directory: ${{ inputs.project-dir }}
        run: |
          if [[ ! -d "${{ inputs.scheme }}Tests" ]]; then
            echo "::notice::${{ inputs.approach }} has no unit test target — nothing to run"
            exit 0
          fi
          ARGS=(-scheme "${{ inputs.scheme }}")
          if [[ -d "${{ inputs.scheme }}.xcworkspace" ]]; then
            ARGS+=(-workspace "${{ inputs.scheme }}.xcworkspace")
          fi
          # The screenshot tour drives a simulator for minutes to produce images a human
          # looks at; the unit suite is what guards the numbers this workflow publishes.
          if [[ -d "${{ inputs.scheme }}UITests" ]]; then
            ARGS+=(-skip-testing:"${{ inputs.scheme }}UITests")
          fi
          # Pinned to the SDK in versions.lock.toml, never left to `OS:latest`: iOS 27
          # ships no "iPhone 17 Pro", so an unpinned destination finds no device at all.
          IOS_SDK="$("$GITHUB_WORKSPACE/tools/versions.py" apple.ios_sdk)"
          xcodebuild test \
            "${ARGS[@]}" \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=$IOS_SDK" \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify

      - name: Archive and measure
        if: steps.guard.outputs.exists == 'true'
        run: ./tools/measure-ios.sh "${{ inputs.approach }}" "${{ inputs.project-dir }}" "${{ inputs.scheme }}"

      - name: Upload size report
        if: steps.guard.outputs.exists == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-size-${{ inputs.approach }}
          path: tools/out/ios-${{ inputs.approach }}.json
          if-no-files-found: warn
