# Run the frozen golden fixtures against every FightCore implementation.
#
# This is the guard rail for the whole repository. Five apps built by five separate
# agents will drift; the contract suite is what catches the drift before an audience
# does. If the Swift core and the Rust core disagree about what a four-leg accumulator
# pays out, that shows up here as a red cell rather than as two phones displaying
# different numbers on a projector.

name: Contract tests

on:
  workflow_dispatch:
  workflow_call:

jobs:
  swift:
    name: Swift core
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Guard
        id: guard
        run: |
          if [[ -f 01-core-swift/sdks/core/Package.swift ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Swift core not written yet"
          fi
      - uses: ./.github/actions/swiftpm-cache
        if: steps.guard.outputs.exists == 'true'
        with:
          key: core-swift
          build-path: 01-core-swift/sdks/core/.build
      - name: Run fixtures
        if: steps.guard.outputs.exists == 'true'
        working-directory: 01-core-swift/sdks/core
        run: swift test --parallel
      - uses: actions/upload-artifact@v7
        if: steps.guard.outputs.exists == 'true' && always()
        with:
          name: contract-swift
          path: 01-core-swift/sdks/core/out/contract-*.json
          if-no-files-found: ignore

  rust:
    name: Rust core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Guard
        id: guard
        run: |
          if [[ -f 02-core-rust/sdks/Cargo.toml ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Rust core not written yet"
          fi
      - name: Read pinned versions
        if: steps.guard.outputs.exists == 'true'
        run: ./tools/versions.py rust.toolchain --github-env PINNED_RUST
      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.exists == 'true'
        with:
          toolchain: ${{ env.PINNED_RUST }}
      - uses: ./.github/actions/cargo-cache
        if: steps.guard.outputs.exists == 'true'
        with:
          key: contract
      - name: Run fixtures
        if: steps.guard.outputs.exists == 'true'
        working-directory: 02-core-rust/sdks
        run: cargo test --workspace --release
      - uses: actions/upload-artifact@v7
        if: steps.guard.outputs.exists == 'true' && always()
        with:
          name: contract-rust
          path: 02-core-rust/sdks/out/contract-*.json
          if-no-files-found: ignore

  native-baseline:
    name: Native baseline (written twice)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Guard
        id: guard
        run: |
          if [[ -n "$(find 00-native/ios -maxdepth 2 -name 'Package.swift' -o -maxdepth 2 -name '*.xcodeproj' 2>/dev/null)" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Native baseline not written yet"
          fi
      # No build-path: Xcode keeps its products in DerivedData, so only the package clones
      # are worth carrying between runs here.
      - uses: ./.github/actions/swiftpm-cache
        if: steps.guard.outputs.exists == 'true'
        with:
          key: native-ios
      # FightDeckUITests is the screenshot tour: it drives a simulator for minutes to
      # produce images a human looks at. FightDeckTests is what holds the fixtures, so
      # running the tour here only buys flakes on the runner that bills at ten times Linux.
      - name: Run fixtures against the hand-written Swift implementation
        if: steps.guard.outputs.exists == 'true'
        working-directory: 00-native/ios
        run: |
          xcodebuild test \
            -scheme FightDeck \
            -skip-testing:FightDeckUITests \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro' \
            CODE_SIGNING_ALLOWED=NO

  summarise:
    name: Summary
    runs-on: ubuntu-24.04
    needs: [swift, rust, native-baseline]
    if: always()
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: contract-*
          path: tools/out
          merge-multiple: true
      - name: Which core failed where
        run: |
          {
            echo "## Contract results"
            echo
            echo "| Core | Result |"
            echo "| --- | --- |"
            echo "| Swift | ${{ needs.swift.result }} |"
            echo "| Rust | ${{ needs.rust.result }} |"
            echo "| Native baseline | ${{ needs.native-baseline.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
