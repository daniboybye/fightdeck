# Build and weigh one iOS host app. Pick the approach from the dropdown.
#
# Every approach uses the same scheme name (FightDeck) and the same folder shape
# (<approach>/ios) on purpose. The five apps are supposed to be interchangeable from
# the outside — that is the whole premise of the comparison — so the build command
# that produces them should be interchangeable too.

name: iOS app

on:
  workflow_dispatch:
    inputs:
      approach:
        description: Which approach to build
        required: true
        type: choice
        options:
          - 00-native
          - 01-core-swift
          - 02-core-rust
          - 03-sdk-rn
          - 04-sdk-skip
      run-tests:
        description: Run unit tests before archiving
        required: false
        default: true
        type: boolean

jobs:
  build:
    uses: ./.github/workflows/_ios-app.yml
    with:
      approach: ${{ inputs.approach }}
      scheme: FightDeck
      project-dir: ${{ inputs.approach }}/ios
      run-tests: ${{ inputs.run-tests }}
