# Build the three Rust SDKs — fightcore, fightslip, fightevents — into an xcframework
# and an AAR apiece.
#
# Rust is the most predictable of the three cores: one cargo workspace, UniFFI generates
# the Swift and Kotlin bindings, and the artifacts drop out the other end. It is
# deliberately the first core built, so that the contract fixtures get a passing
# implementation early and the other cores have something to disagree with.

name: SDK — Rust core

on:
  # Iterating on one target should not pay for the other two, and the XCFramework job is on
  # macOS at ten times the Linux rate. workflow_call leaves the input unset, so the measure
  # run still gets all three.
  workflow_dispatch:
    inputs:
      job:
        description: Which target to build
        type: choice
        default: both
        options:
          - both
          - apple
          - android
  workflow_call:

jobs:
  apple:
    name: XCFramework
    if: inputs.job != 'android'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Guard
        id: guard
        run: |
          if [[ -f 02-core-rust/sdks/Cargo.toml ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Rust core not written yet"
          fi

      - name: Read pinned versions
        if: steps.guard.outputs.exists == 'true'
        run: ./tools/versions.py rust.toolchain --github-env PINNED_RUST

      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.exists == 'true'
        with:
          toolchain: ${{ env.PINNED_RUST }}
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      # The most valuable cache in the repository: this job builds all three crates for
      # three Apple triples from scratch, and was the slowest macOS job outside Skip's AARs.
      - uses: ./.github/actions/cargo-cache
        if: steps.guard.outputs.exists == 'true'
        with:
          key: apple

      - name: Build and package
        if: steps.guard.outputs.exists == 'true'
        working-directory: 02-core-rust/sdks
        run: ./build-apple.sh

      - uses: actions/upload-artifact@v7
        if: steps.guard.outputs.exists == 'true'
        with:
          name: rust-sdk-xcframeworks
          path: 02-core-rust/sdks/*/out/*.xcframework.zip
          if-no-files-found: warn

  android:
    name: AAR
    if: inputs.job != 'apple'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Guard
        id: guard
        run: |
          if [[ -f 02-core-rust/sdks/Cargo.toml ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Rust core not written yet"
          fi

      - name: Read pinned versions
        if: steps.guard.outputs.exists == 'true'
        run: |
          ./tools/versions.py rust.toolchain --github-env PINNED_RUST
          ./tools/versions.py rust.cargo_ndk --github-env PINNED_CARGO_NDK
          ./tools/versions.py android.jdk --github-env PINNED_JDK
          ./tools/versions.py android.ndk --github-env PINNED_NDK

      - uses: actions/setup-java@v5
        if: steps.guard.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: ${{ env.PINNED_JDK }}

      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.exists == 'true'
        with:
          toolchain: ${{ env.PINNED_RUST }}
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: ./.github/actions/cargo-cache
        if: steps.guard.outputs.exists == 'true'
        with:
          key: android

      # Its own entry, with no restore-keys: the pinned version is the whole key, so bumping
      # the pin misses cleanly and rebuilds rather than restoring the previous binary under
      # the new version's name.
      - uses: actions/cache@v6
        if: steps.guard.outputs.exists == 'true'
        with:
          path: ~/.cargo/bin/cargo-ndk
          key: cargo-ndk-${{ runner.os }}-${{ env.PINNED_CARGO_NDK }}

      # Guarded on the binary rather than run unconditionally: `cargo install` decides what
      # is already installed from ~/.cargo/.crates.toml, which is not cached, so on a warm
      # runner it would rebuild a cargo-ndk that is sitting right there.
      - name: Install cargo-ndk
        if: steps.guard.outputs.exists == 'true'
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --version "$PINNED_CARGO_NDK" --locked

      - name: Build and package
        if: steps.guard.outputs.exists == 'true'
        working-directory: 02-core-rust/sdks
        run: ./build-android.sh

      - uses: actions/upload-artifact@v7
        if: steps.guard.outputs.exists == 'true'
        with:
          name: rust-sdk-aars
          path: 02-core-rust/sdks/*/out/android/*.aar
          if-no-files-found: warn
