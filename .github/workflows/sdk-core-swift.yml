# Build the Swift FightCore for Apple and, the interesting half, for Android.
#
# The Android job is the most fragile thing in this repository, and it now passes: the core
# cross-compiles against the official Swift 6.3 Android SDK and swift-java jextract emits
# the JNI bindings the Compose app calls. What keeps it fragile is the toolchain's age —
# swift-java is pre-1.0 and changed API twice in a month, NDK compatibility past r27d is
# unconfirmed, and the Swift SDK must match the compiler build exactly, not just the
# version number. It stays non-blocking so a toolchain release cannot redden the whole
# workflow, and because "here is exactly where it broke" is itself a result worth a slide.

name: SDK — Swift core

on:
  # Debugging the Android half used to drag the Apple half along for the ride, nine times
  # over, and macOS minutes bill at ten times the Linux rate. Pick a half when iterating.
  # workflow_call leaves the input unset, so the measure run still gets both.
  workflow_dispatch:
    inputs:
      job:
        description: Which half to run
        type: choice
        default: both
        options:
          - both
          - apple
          - android
  workflow_call:

jobs:
  apple:
    name: Apple
    if: inputs.job != 'android'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Guard
        id: guard
        run: |
          if [[ -f 01-core-swift/sdks/core/Package.swift ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Swift core not written yet"
          fi

      - name: Pin Xcode
        if: steps.guard.outputs.exists == 'true'
        run: |
          XCODE_VERSION="$(./tools/versions.py apple.xcode)"
          sudo xcode-select -switch "/Applications/Xcode_${XCODE_VERSION}.app" 2>/dev/null \
            || echo "::warning::Xcode ${XCODE_VERSION} not found; using runner default"
          swift --version

      - uses: ./.github/actions/swiftpm-cache
        if: steps.guard.outputs.exists == 'true'
        with:
          key: core-swift-apple
          build-path: 01-core-swift/sdks/core/.build

      - name: Test
        if: steps.guard.outputs.exists == 'true'
        working-directory: 01-core-swift/sdks/core
        run: swift test

  android:
    name: Android (Swift SDK)
    if: inputs.job != 'apple'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # Green since the jextract bridge landed, but kept non-blocking: every dependency here
    # is pre-1.0 or version-locked to a specific compiler build, so this job reports on the
    # toolchain rather than on the change under review.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - name: Guard
        id: guard
        run: |
          if [[ -f 01-core-swift/sdks/core/Package.swift ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read pinned JDK
        if: steps.guard.outputs.exists == 'true'
        run: ./tools/versions.py android.jdk --github-env PINNED_JDK

      - uses: actions/setup-java@v5
        if: steps.guard.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: ${{ env.PINNED_JDK }}

      - uses: ./.github/actions/install-swift-android
        if: steps.guard.outputs.exists == 'true'

      - uses: ./.github/actions/swiftpm-cache
        if: steps.guard.outputs.exists == 'true'
        with:
          key: core-swift-android
          build-path: 01-core-swift/sdks/android/.build

      # sdks/android links core, slip and events into the one libfightdeck.so the app loads,
      # so building it cross-compiles all three packages and their jextract facades.
      - name: Cross-compile for aarch64-unknown-linux-android
        if: steps.guard.outputs.exists == 'true'
        working-directory: 01-core-swift/sdks/android
        run: |
          swift build \
            --swift-sdk "aarch64-unknown-linux-android${PINNED_MIN_SDK}" \
            --product FightDeckShared \
            --disable-sandbox \
            -c release

      - name: Package AAR (swift-java jextract --mode=jni)
        if: steps.guard.outputs.exists == 'true'
        working-directory: 01-core-swift/sdks
        run: |
          # --mode=ffm needs JDK 22+ and java.lang.foreign, neither of which exists on
          # Android: ART is not a JVM and has no Panama. JNI mode is the only option here.
          # The script also builds swift-java's SwiftKitCore jar from the resolved checkout,
          # which needs the pinned JDK 17 set up above.
          ./build-aars.sh

      - uses: actions/upload-artifact@v7
        if: steps.guard.outputs.exists == 'true'
        with:
          name: swift-core-aar
          retention-days: 7
          path: 01-core-swift/sdks/android/out/*.aar
          if-no-files-found: warn
