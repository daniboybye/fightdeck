# Builds the local React Native binary SDKs in dependency order.

name: SDK — React Native

on:
  workflow_dispatch:
    inputs:
      job:
        description: Which platform to build
        type: choice
        default: both
        options: [both, apple, android]
  workflow_call:

jobs:
  apple:
    name: XCFrameworks
    if: inputs.job != 'android'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned versions
        run: |
          ./tools/versions.py react_native.node --github-env PINNED_NODE
          ./tools/versions.py apple.xcode --github-env PINNED_XCODE

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PINNED_NODE }}
          cache: npm
          cache-dependency-path: 03-sdk-rn/sdks/core/package-lock.json

      - uses: actions/cache@v6
        with:
          path: ~/Library/Caches/CocoaPods
          key: cocoapods-${{ runner.os }}-${{ hashFiles('03-sdk-rn/ios/Podfile.lock') }}
          restore-keys: cocoapods-${{ runner.os }}-

      - uses: ./.github/actions/swiftpm-cache
        with:
          key: sdk-rn-apple
          build-path: |
            03-sdk-rn/sdks/core/.build
            03-sdk-rn/sdks/core/ios/BuildPackage/.build
            03-sdk-rn/sdks/deposit/.build
            03-sdk-rn/sdks/betslip/.build
            03-sdk-rn/sdks/fighter/.build

      - name: Pin Xcode
        run: |
          sudo xcode-select -switch "/Applications/Xcode_${PINNED_XCODE}.app" 2>/dev/null \
            || echo "::warning::Xcode ${PINNED_XCODE} not found; using runner default"

      - name: Build local binary SDKs
        run: |
          npm ci --prefix 03-sdk-rn/sdks/core
          pod --version || sudo gem install cocoapods --no-document
          ./03-sdk-rn/sdks/build-apple.sh

      - uses: actions/upload-artifact@v7
        with:
          name: rn-xcframeworks
          retention-days: 7
          path: 03-sdk-rn/sdks/*/out/*.xcframework.zip
          if-no-files-found: error

  android:
    name: AARs
    if: inputs.job != 'apple'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Read pinned versions
        run: |
          ./tools/versions.py react_native.node --github-env PINNED_NODE
          ./tools/versions.py android.jdk --github-env PINNED_JDK

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.PINNED_NODE }}
          cache: npm
          cache-dependency-path: 03-sdk-rn/sdks/core/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.PINNED_JDK }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Build local binary SDKs
        run: |
          npm ci --prefix 03-sdk-rn/sdks/core
          ./03-sdk-rn/sdks/build-android.sh

      - uses: actions/upload-artifact@v7
        with:
          name: rn-aars
          retention-days: 7
          path: 03-sdk-rn/sdks/*/out/*.aar
          if-no-files-found: error
