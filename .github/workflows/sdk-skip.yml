# Build the Skip SDKs: one shared core plus four focused modules.
#
# Same split as the React Native SDKs, and deliberately the same packaging, because a
# size comparison between two technologies packaged differently is worthless.
#
# The asymmetry this workflow exposes is the point: on Apple a Skip module is an ordinary
# Swift package and costs essentially nothing extra, while on Android it carries a native
# Swift runtime. One technology, two very different bills.

name: SDK — Skip

on:
  # Both halves run on macOS here, because Skip transpiles on a Mac even for Android, so a
  # dispatch that only needs one of them costs twice what it should. workflow_call leaves
  # the input unset, so the measure run still gets both.
  workflow_dispatch:
    inputs:
      job:
        description: Which half to run
        type: choice
        default: both
        options:
          - both
          - apple
          - android
  workflow_call:

jobs:
  apple:
    name: Core tests
    if: inputs.job != 'android'
    runs-on: macos-26
    timeout-minutes: 45
    # Nothing to package on Apple: the iOS app compiles the SDKs from source. What is left is
    # the core's fixture suite, against the transpiling source build.
    env:
      FIGHTDECK_BUILDING_SDK: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Guard
        id: guard
        run: |
          if [[ -f 04-sdk-skip/sdks/core/Package.swift ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skip core not written yet"
          fi

      - name: Pin Xcode
        if: steps.guard.outputs.exists == 'true'
        run: |
          XCODE_VERSION="$(./tools/versions.py apple.xcode)"
          sudo xcode-select -switch "/Applications/Xcode_${XCODE_VERSION}.app" 2>/dev/null \
            || echo "::warning::Xcode ${XCODE_VERSION} not found; using runner default"

      - uses: ./.github/actions/swiftpm-cache
        if: steps.guard.outputs.exists == 'true'
        with:
          key: sdk-skip-core
          build-path: 04-sdk-skip/sdks/core/.build

      # Only the headless module. `swift test` builds for the host, and the feature modules are
      # SwiftUI over UIKit, which does not exist on macOS; the host app's own suite covers them.
      - name: Test
        if: steps.guard.outputs.exists == 'true'
        working-directory: 04-sdk-skip/sdks/core
        run: swift test

  # One job for all AARs: the feature modules link against core's AAR instead of
  # re-transpiling it, so they cannot be built in parallel with it.
  android:
    name: AARs
    if: inputs.job != 'apple'
    runs-on: macos-26
    # macOS rather than Linux: skipstone drives the Swift toolchain plus Gradle, and the
    # documented path runs on a Mac. Moving it to Linux is an optimisation for later, not
    # something to discover is broken the week of the talk.
    timeout-minutes: 75
    env:
      FIGHTDECK_BUILDING_SDK: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Guard
        id: guard
        run: |
          if [[ -f 04-sdk-skip/sdks/core/Package.swift ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read pinned versions
        if: steps.guard.outputs.exists == 'true'
        run: ./tools/versions.py android.jdk --github-env PINNED_JDK

      - uses: actions/setup-java@v5
        if: steps.guard.outputs.exists == 'true'
        with:
          distribution: temurin
          java-version: ${{ env.PINNED_JDK }}

      # The release archive rather than the tap: brew installs whatever is newest, and a
      # CLI newer than the skipstone the packages pin generates Gradle projects this
      # build's patches no longer recognise. The lock file is only a pin if it is used.
      - uses: ./.github/actions/install-skip
        if: steps.guard.outputs.exists == 'true'

      # skipstone drives Gradle three times over, serially, because the feature modules link
      # against core's AAR instead of re-transpiling it. At 16 macOS minutes this was the
      # single most expensive job in the repository, and most of it was Gradle starting cold.
      - uses: gradle/actions/setup-gradle@v6
        if: steps.guard.outputs.exists == 'true'

      - uses: ./.github/actions/swiftpm-cache
        if: steps.guard.outputs.exists == 'true'
        with:
          key: sdk-skip-android
          build-path: |
            04-sdk-skip/sdks/core/.build
            04-sdk-skip/sdks/events/.build
            04-sdk-skip/sdks/deposit/.build
            04-sdk-skip/sdks/betslip/.build
            04-sdk-skip/sdks/fighter/.build

      - name: Skip checkup
        if: steps.guard.outputs.exists == 'true'
        run: skip checkup --verbose || echo "::warning::skip checkup reported problems"

      - name: Export the AARs
        if: steps.guard.outputs.exists == 'true'
        run: ./04-sdk-skip/sdks/build-aars.sh

      - uses: actions/upload-artifact@v7
        if: steps.guard.outputs.exists == 'true'
        with:
          name: skip-aars
          retention-days: 7
          path: 04-sdk-skip/sdks/*/out/*.aar
          if-no-files-found: warn
