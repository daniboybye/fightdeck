name: FightDeck
options:
  bundleIdPrefix: com.fightdeck
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    revision: cf8be20d07654570554c8a8a4952bc8a5766a8b0 # 8.9.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_ALLOWED: NO

targets:
  FightDeck:
    type: application
    platform: iOS
    sources:
      - path: FightDeck
    dependencies:
      - framework: ../sdks/core/out/FightCore.xcframework
        embed: false
      - package: Kingfisher
    info:
      path: FightDeck/Info.plist
      properties:
        UIBackgroundModes:
          - audio
    settings:
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_CFBundleDisplayName: FD 2 Rust
      PRODUCT_BUNDLE_IDENTIFIER: com.fightdeck.rust
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_NSLocalNetworkUsageDescription: Serves dataset images over localhost for demo image loading.
      GENERATE_INFOPLIST_FILE: YES
      HEADER_SEARCH_PATHS:
        - $(SRCROOT)/FightDeck/Generated
      SWIFT_INCLUDE_PATHS:
        - $(SRCROOT)/FightDeck/Generated
      OTHER_CFLAGS:
        - -fmodule-map-file=$(SRCROOT)/FightDeck/Generated/fightcoreFFI.modulemap
      OTHER_SWIFT_FLAGS:
        - -Xcc
        - -fmodule-map-file=$(SRCROOT)/FightDeck/Generated/fightcoreFFI.modulemap
      OTHER_LDFLAGS:
        - -lc++
      FRAMEWORK_SEARCH_PATHS:
        - $(SRCROOT)/../sdks/core/out
    scheme:
      testTargets:
        - FightDeckTests
        - FightDeckUITests

  FightDeckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FightDeckTests
    dependencies:
      - target: FightDeck
      - framework: ../sdks/core/out/FightCore.xcframework
        embed: false
    resources:
      - path: ../../contract/fixtures
        type: folder
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.fightdeck.rust.tests
      GENERATE_INFOPLIST_FILE: YES
      HEADER_SEARCH_PATHS:
        - $(SRCROOT)/FightDeck/Generated
      SWIFT_INCLUDE_PATHS:
        - $(SRCROOT)/FightDeck/Generated
      OTHER_CFLAGS:
        - -fmodule-map-file=$(SRCROOT)/FightDeck/Generated/fightcoreFFI.modulemap
      OTHER_SWIFT_FLAGS:
        - -Xcc
        - -fmodule-map-file=$(SRCROOT)/FightDeck/Generated/fightcoreFFI.modulemap
      OTHER_LDFLAGS:
        - -lc++
      FRAMEWORK_SEARCH_PATHS:
        - $(SRCROOT)/../sdks/core/out

  FightDeckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FightDeckUITests
    dependencies:
      - target: FightDeck
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.fightdeck.rust.uitests
      GENERATE_INFOPLIST_FILE: YES

schemes:
  FightDeck:
    build:
      targets:
        FightDeck: all
    test:
      targets:
        - FightDeckUITests
        - FightDeckTests
    run:
      environmentVariables:
        FIGHTDECK_DATASET_ROOT: $(SRCROOT)/../../dataset
