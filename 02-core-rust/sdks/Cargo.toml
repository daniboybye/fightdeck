[workspace]
members = ["core/fightcore", "slip/fightslip", "events/fightevents"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
fightcore = { path = "core/fightcore" }
rust_decimal = { version = "1.42.1", features = ["maths"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uniffi = { version = "0.32.0", features = ["cli"] }
