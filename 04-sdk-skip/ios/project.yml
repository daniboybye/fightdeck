name: FightDeck
options:
  bundleIdPrefix: com.fightdeck
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Kingfisher:
    url: https://github.com/onevcat/Kingfisher.git
    revision: cf8be20d07654570554c8a8a4952bc8a5766a8b0 # 8.9.0
  FightDeckCore:
    path: ../sdks/core
  FightDeckDeposit:
    path: ../sdks/deposit
  FightDeckBetslip:
    path: ../sdks/betslip
  FightDeckFighter:
    path: ../sdks/fighter

settingGroups:
  fightdeck_app:
    base:
      SWIFT_VERSION: "6.0"
      SWIFT_STRICT_CONCURRENCY: complete
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_ALLOWED: NO
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
      INFOPLIST_KEY_NSLocalNetworkUsageDescription: Serves dataset images over localhost for demo image loading.
      GENERATE_INFOPLIST_FILE: YES

targetTemplates:
  FightDeckHost:
    type: application
    platform: iOS
    info:
      path: FightDeck/Info.plist
      properties:
        UIBackgroundModes:
          - audio
    settings:
      groups:
        - fightdeck_app
    sources:
      - path: FightDeck
        excludes:
          - Deposit/**
      - path: FightDeck/Features/Fighter
      - path: FightDeck/Features/News
      - path: FightDeck/Features/Video
    resources:
      - path: ../../shared-ui-spec/tokens.json

  # No app sources, no resources, no Kingfisher — a harness that carried the demo app's
  # code would put it on both sides of the subtraction and measure nothing about the SDK.
  FightDeckHarness:
    type: application
    platform: iOS
    settings:
      groups:
        - fightdeck_app

targets:
  FightDeck:
    templates: [FightDeckHost]
    # Must be nested under `base`. A flat mapping here is silently dropped when the
    # target also inherits structured settings from a template.
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: FD 4 Skip
        PRODUCT_BUNDLE_IDENTIFIER: com.fightdeck.sdk.skip
    dependencies:
      - package: Kingfisher
      - package: FightDeckCore
        product: FightDeckCore
      - package: FightDeckDeposit
        product: FightDeckDeposit
      - package: FightDeckBetslip
        product: FightDeckBetslip
      - package: FightDeckFighter
        product: FightDeckFighter

  # The four size-measurement hosts. They share Harness/Shared and take exactly one
  # Harness/<stage> directory each, so no source file needs an #if to compile against a
  # link set that is missing a feature SDK. tools/measure-second-feature.sh builds all
  # four and subtracts; nothing else references them.
  FightDeckHarnessRuntime:
    templates: [FightDeckHarness]
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: FD4 H-Runtime
        PRODUCT_BUNDLE_IDENTIFIER: com.fightdeck.sdk.skip.harness.runtime
    sources:
      - path: Harness/Shared
      - path: Harness/Runtime
    dependencies:
      - package: FightDeckCore
        product: FightDeckCore

  FightDeckHarnessDeposit:
    templates: [FightDeckHarness]
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: FD4 H-Deposit
        PRODUCT_BUNDLE_IDENTIFIER: com.fightdeck.sdk.skip.harness.deposit
    sources:
      - path: Harness/Shared
      - path: Harness/Deposit
    dependencies:
      - package: FightDeckCore
        product: FightDeckCore
      - package: FightDeckDeposit
        product: FightDeckDeposit

  FightDeckHarnessBoth:
    templates: [FightDeckHarness]
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: FD4 H-Both
        PRODUCT_BUNDLE_IDENTIFIER: com.fightdeck.sdk.skip.harness.both
    sources:
      - path: Harness/Shared
      - path: Harness/Both
    dependencies:
      - package: FightDeckCore
        product: FightDeckCore
      - package: FightDeckDeposit
        product: FightDeckDeposit
      - package: FightDeckBetslip
        product: FightDeckBetslip

  FightDeckHarnessAll:
    templates: [FightDeckHarness]
    settings:
      base:
        INFOPLIST_KEY_CFBundleDisplayName: FD4 H-All
        PRODUCT_BUNDLE_IDENTIFIER: com.fightdeck.sdk.skip.harness.all
    sources:
      - path: Harness/Shared
      - path: Harness/All
    dependencies:
      - package: FightDeckCore
        product: FightDeckCore
      - package: FightDeckDeposit
        product: FightDeckDeposit
      - package: FightDeckBetslip
        product: FightDeckBetslip
      - package: FightDeckFighter
        product: FightDeckFighter

  FightDeckUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FightDeckUITests
    dependencies:
      - target: FightDeck
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.fightdeck.sdk.skip.uitests
      GENERATE_INFOPLIST_FILE: YES

schemes:
  FightDeck:
    build:
      targets:
        FightDeck: all
    test:
      targets:
        - FightDeckUITests
    run:
      environmentVariables:
        FIGHTDECK_DATASET_ROOT: $(SRCROOT)/../../dataset
        FIGHTDECK_LOCAL_SDK: "1"

  FightDeckHarnessRuntime:
    build:
      targets:
        FightDeckHarnessRuntime: all
    run:
      environmentVariables:
        FIGHTDECK_LOCAL_SDK: "1"

  FightDeckHarnessDeposit:
    build:
      targets:
        FightDeckHarnessDeposit: all
    run:
      environmentVariables:
        FIGHTDECK_LOCAL_SDK: "1"

  FightDeckHarnessBoth:
    build:
      targets:
        FightDeckHarnessBoth: all
    run:
      environmentVariables:
        FIGHTDECK_LOCAL_SDK: "1"

  FightDeckHarnessAll:
    build:
      targets:
        FightDeckHarnessAll: all
    run:
      environmentVariables:
        FIGHTDECK_LOCAL_SDK: "1"
