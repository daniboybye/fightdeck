# fightdeck — pinned toolchain
#
# Rule: latest stable everywhere. Nothing here is a beta or a release candidate.
# Verified 20 August 2026, and the Apple/Android sections again on 11 September 2026
# when 01-core-swift moved to a swift-java JNI bridge; Skip and swift-java re-checked on
# 25 September 2026. Every workflow in
# .github/workflows reads from this file so a version bump happens in one place.
#
# When a value changes, note WHY in the comment on the line. A version with no
# reason attached is a version nobody can audit later.

[meta]
verified = "2026-09-11"
rule = "latest stable everywhere"

# ---------------------------------------------------------------------------
# Apple
# ---------------------------------------------------------------------------
[apple]
swift = "6.3.3"                        # 30 June 2026. 6.4 is NOT stable: Xcode 27 betas only.
xcode = "26.6"
xcode_build = "17F113"
ios_sdk = "26.5"
ios_device = "26.6.1"                  # what the demo devices actually run
ios_deployment = "26.1"                # tabViewBottomAccessory(isEnabled:) lands in 26.1
macos_deployment = "26.0"

[apple.swift_sdks]
# Cross-compilation bundles installed with `swift sdk install`
android = "swift-6.3.3-RELEASE_android"
# swift sdk install refuses a remote bundle without one. Published alongside the
# bundle on swift.org/documentation/articles/swift-sdk-for-android-getting-started.
android_checksum = "d160cc3206dd1886dae3fef2337af5e25ec034692cd0ec225721c56cc69da7f5"

[apple.packages]
# pre-1.0: no API stability guarantee, expect churn. The 0.4.2 written here in June was two
# minor versions stale by September — 0.5.0, 0.5.1 and 0.6.0 shipped in ten weeks, most of
# the changes in the JNI generator this approach depends on.
swift_java = "0.6.0"                   # 5 Sep 2026, and still the latest release on 25 Sep 2026.
swiftkit_core = "0.6.0"                # the Java runtime the generated bindings compile against


# ---------------------------------------------------------------------------
# Android
# ---------------------------------------------------------------------------
[android]
platform_version = "17"
compile_sdk = 37                       # Android 17, released 16 June 2026
target_sdk = 37
min_sdk = 28                           # Swift SDK for Android targets ...-android28
android_studio = "Quail 3 (2026.1.3 Patch 1)"
agp = "9.3.1"
gradle = "9.7.1"
jdk = "17"
kotlin = "2.4.10"                      # 2.5 is planned for December 2026
compose_bom = "2026.08.00"             # resolves to Compose 1.12.0
compose = "1.12.0"
compose_multiplatform = "1.11.1"       # bonus measurement only, not a demo target
ndk = "27.3.13750724"                  # r27d LTS. r29 compatibility with the Swift SDK is UNCONFIRMED.
jna = "5.19.1"                         # 16 KB page alignment on arm64-v8a/x86_64/armeabi-v7a; 5.16.0 fails dlopen on page_size_16kb AVDs (JNA #1647).
bundletool = "1.18.3"                  # measure-android.sh only. Release assets are version-stamped, so /latest/ cannot be used.

# ---------------------------------------------------------------------------
# React Native — bare, deliberately not Expo
# ---------------------------------------------------------------------------
# Expo SDK 57 (stable) still ships RN 0.86.2, which would put us a version behind.
# For a brownfield SDK scenario bare RN is the correct choice anyway. expo-glass-effect
# appears in the talk as EVIDENCE of day-one API lag, never as a dependency.
[react_native]
version = "0.87.0"                     # 11 August 2026
react = "19.2.3"
hermes = "v1"                          # default since RN 0.84
node = "24.19.0"                       # LTS. Local dev machines may run newer; CI pins this.
typescript = "7.0.2"
bridgeless = true                      # 0.87 has no other mode

[react_native.packages]
screens = "4.27.0"
safe_area_context = "5.9.1"
keyboard_controller = "1.22.4"         # literally the exhibit from the hiring-argument section

# ---------------------------------------------------------------------------
# Rust
# ---------------------------------------------------------------------------
[rust]
toolchain = "1.97.1"
uniffi = "0.32.0"
cargo_ndk = "4.1.2"
jni = "0.22.4"
rust_decimal = "1.42.1"                # money never touches f64

[rust.optional]
# Only if Crux enters as a variant
crux_core = "0.20.0"                   # 7 August 2026
boltffi = "0.29.3"                     # crux migrated off UniFFI onto BoltFFI in 0.19

[rust.targets]
android = [
  "aarch64-linux-android",
]
apple = [
  "aarch64-apple-ios",
  "aarch64-apple-ios-sim",
  "x86_64-apple-ios",
]

# ---------------------------------------------------------------------------
# Skip
# ---------------------------------------------------------------------------
# Free and open source since 21 January 2026 (v1.7). Frameworks are MPL-2.0,
# but the skipstone build engine is AGPL-3.0 — that distinction matters and is a slide.
[skip]
skipstone = "1.9.11"                   # 19 Sep 2026. CLI and SPM plugin ship in lockstep.
skip_ui = "1.60.0"                     # 23 Sep 2026. Cuts Android recomposition; opacity now layers within the clip.
skip_foundation = "1.4.6"              # 23 Sep 2026
skip_model = "1.8.0"                   # 18 Sep 2026. Transitive via skip-ui; pinned for audit only.
skip_lib = "1.4.3"                     # 23 Sep 2026. Transitive via skip-foundation; audit only.
skip_unit = "1.7.2"                    # 16 Sep 2026. Transitive via skip-foundation; audit only.
skip_fuse = "1.0.3"                    # 19 Aug 2026, still the latest. Fuse is not shipped here — see 04-sdk-skip/README.md.
skip_fuse_ui = "1.18.3"                # 24 Sep 2026. Not shipped here either; audit only.
license_frameworks = "MPL-2.0"
license_skipstone = "AGPL-3.0"

# ---------------------------------------------------------------------------
# CI
# ---------------------------------------------------------------------------
[ci]
# macos-15 is being retired; macos-26 ships Xcode 26.6 by default.
# ubuntu-24.04 preinstalls Gradle, Kotlin, Rust, Swift, Android API 37 and NDK 27.3/28.2/29.0.
macos_runner = "macos-26"
linux_runner = "ubuntu-24.04"

[ci.actions]
checkout = "actions/checkout@v7"
setup_java = "actions/setup-java@v5"
setup_node = "actions/setup-node@v7"
setup_swift = "swiftly (swift.org installer, no marketplace action)"
setup_rust = "dtolnay/rust-toolchain@stable"
upload_artifact = "actions/upload-artifact@v7"
download_artifact = "actions/download-artifact@v8"
